<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Heart | Birthday Surprise</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loader">

<div class="loader-circle"></div>

<h1>Golden Heart</h1>

<p>Preparing your magical journey...</p>

</div>

<div id="stars"></div>

<div id="particles"></div>

<section class="hero">

<div class="glass">

<h3>A Special Surprise Awaits...</h3>

<h1>

Happy 16th Birthday

</h1>

<h2>

Hemadarshan

</h2>

<p>

Every great story begins with one magical moment.

Tonight...

this story belongs to you.

</p>

<button id="start">

✨ Enter The Journey ✨

</button>

</div>

</section> 
  <!-- Royal Palace Doors -->

<div id="palace">

    <div id="leftDoor"></div>

    <div id="rightDoor"></div>

    <div id="goldLight"></div>
</div>
  <div id="passwordPage">

    <div class="passwordBox">

        <h2>🔐 Secret Entrance</h2>

        <p>Enter the secret password</p>

        <input
        id="passwordInput"
        type="password"
        placeholder="Password">

        <button id="unlockBtn">

            Unlock

        </button>

    </div>
  </div>

<script src="script.js"></script>

</body>

</html>
